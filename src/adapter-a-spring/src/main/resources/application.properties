spring.application.name=adapter-a-spring
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:dummydb}?currentSchema=adapter_a
spring.datasource.username=${DB_USER:dummyuser}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.schemas=adapter_a
spring.devtools.restart.enabled=false
spring.jpa.properties.hibernate.type.json_format_mapper=com.adapteraspring.config.Jackson3JsonFormatMapper