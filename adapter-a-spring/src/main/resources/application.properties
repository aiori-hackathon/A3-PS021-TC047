spring.application.name=adapter-a-spring
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:adapter_a}?currentSchema=adapter_a
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=adapter_a
spring.flyway.schemas=adapter_a
spring.flyway.default-schema=adapter_a
spring.flyway.create-schemas=true
spring.devtools.restart.enabled=false
planner.mode=passthrough
b.base-url=${B_BASE_URL:http://localhost:8000}
b.connect-timeout-ms=${B_CONNECT_TIMEOUT_MS:2000}
b.read-timeout-ms=${B_READ_TIMEOUT_MS:5000}
retry.backoff-ms=${RETRY_BACKOFF_MS:3000}
retry.max-attempts=${RETRY_MAX_ATTEMPTS:15}
retry.poll-interval-ms=${RETRY_POLL_INTERVAL_MS:1000}
fault-injection=${FAULT_INJECTION:false}
